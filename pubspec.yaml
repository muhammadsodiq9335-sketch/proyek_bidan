name: proyek_bidan
description: "Aplikasi Manajemen Bidan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  url_launcher: ^6.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.2.0
  supabase_flutter: ^2.8.4
  shared_preferences: ^2.5.3
  file_picker: ^11.0.2
  syncfusion_flutter_pdfviewer: ^33.2.4
  image_picker: ^1.2.2
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  universal_html: ^2.3.0
  audioplayers: ^6.1.0
  vibration: ^3.1.8
  path_provider: ^2.1.5
  open_file: ^3.5.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
